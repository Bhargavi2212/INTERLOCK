<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interlock</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Interlock</h1>
    <p class="tagline">No plant change is signed off until every document agrees, and the numbers still work.</p>
    <p class="version">version <span id="version">…</span></p>
  </header>

  <main>
    <section id="plant">
      <h2>Plant</h2>
      <div class="row">
        <input id="plant-name" placeholder="Plant name, e.g. BHEL Lara" autocomplete="off">
        <button id="new-plant">New plant</button>
        <span id="plant-info" class="muted">No plant selected.</span>
      </div>
    </section>

    <section id="upload">
      <h2>Documents</h2>
      <div id="drop" class="drop">
        Drop a folder or PDF files here, or
        <label class="button">Choose folder<input id="pick-folder" type="file" webkitdirectory multiple hidden></label>
        <label class="button">Choose files<input id="pick-files" type="file" multiple hidden></label>
      </div>
      <p id="upload-status" class="muted"></p>
      <table id="files"><thead><tr><th>File</th><th>Status</th><th>Progress</th></tr></thead><tbody></tbody></table>
      <p id="ingest-status"></p>
    </section>

    <section id="change">
      <h2>Change</h2>
      <p class="muted">The change check arrives in this phase's next step.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
