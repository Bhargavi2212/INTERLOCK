<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interlock</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9; color: #1b1f24;
    }
    @media (prefers-color-scheme: dark) { body { background: #14171b; color: #e6e8eb; } }
    main { padding: 0 16px; max-width: 34rem; text-align: center; }
    h1 { font-size: 2.2rem; margin: 0 0 .5rem; letter-spacing: .02em; }
    p { line-height: 1.5; margin: .5rem 0; }
    .version { font-size: .85rem; opacity: .6; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Interlock</h1>
    <p>No plant change is signed off until every document agrees, and the numbers still work.</p>
    <p class="version">version <span id="version">…</span></p>
  </main>
  <script>
    fetch("/health").then(r => r.json())
      .then(d => { document.getElementById("version").textContent = d.version; })
      .catch(() => { document.getElementById("version").textContent = "unavailable"; });
  </script>
</body>
</html>
