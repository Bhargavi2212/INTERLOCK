# Reading settings: thresholds and thinking levels. Not engineering limits
# (those live only in app/rules/rules.yaml, mirroring docs/RULES.md).
# Measured results (e.g. the same-item threshold's precision/recall) go to docs/EVAL.md only.
version: 1
ingest:
  drawing_min_long_side_mm: 600   # A2 and larger
  drawing_max_text_chars: 200     # near-empty text layer
  png_dpi: 150
  progress_every_pages: 10
  readable_min_chars: 20          # non-space characters for a page to count as read (BHEL: 46 pages below; same at 50)
evidence:
  table_row_word_fraction: 0.9
scenario:
  service_quote_marker: fluid to be handled   # service only from the data sheet's Fluid to be handled value
same_item:
  mode: decisions                 # decisions | names (fallback)
  threshold: 0.25                 # FROZEN 21 Nov 13:33: chosen once on set A (EVAL.md section 5); unchanged for set E
  min_confidence: 0.6
  max_input_tokens: 262144        # Decisions API input limit per call
  max_pages_per_call: 20
long_read:
  token_limit: 1048576
  chars_per_token_estimate: 4
values:
  design_basis_pages: 5            # top pages with 'velocity' and 'm/s' added to the values call
drawing:
  max_pages: 2
  crop_fraction: 0.40              # window around the text-layer anchor (PHASE_3 Amendments B7)
  max_image_px: 3072
  box_margin: 0.01                 # of the page, around a box when collecting text-layer words
  box_format: {order: yx, scale: 1000}   # CALIBRATED 21 Nov on ESP Unit-1 (Part3 p.146; not a B item): centre distance 0.0048 (yx and xy tie), IoU yx 0.44 vs xy 0.22, yx matches the label's left/top edge and width; eval/results/calibration_esp_unit1.json
  min_name_words: 2                # name words a label must contain (besides the unit tag)
  abbreviations: {flr: floor, wtr: water, wwtr: water, pp: pump, pumps: pump, xfer: transfer, trf: transfer, tr: transfer}
  stop_words: [the, and, of, for, sg, unit, no, nos]
thinking:                          # every call starts low (PHASE_2 Amendments A4)
  understand: low
  long_read: low
  values: low
  explain: low
  headlines: low
  drawing: low
