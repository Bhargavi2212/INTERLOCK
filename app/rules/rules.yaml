# Every limit, default and unit factor the rule engine uses.
# Mirrors docs/RULES.md exactly; tests/rules/test_rules_match_doc.py enforces it.
# confirm: false = confirmed by Bhargavi on 21 Nov (RULES.md confirmed table); true = not yet.
version: 1
tolerance_rel: 1.0e-9
rules:
  R1:
    name: Pipe velocity
    live: true
    defaults:
      max_velocity: {value: 3.0, unit: m/s, confirm: false}
      max_velocity_suction: {value: 1.8, unit: m/s, confirm: true}
    line_roles: [discharge header, pump suction, pump discharge]  # most specific first
    assumed_line_role: pump discharge
    suction_line_role: pump suction
    solids_services: {value: [slurry, sludge, ash slurry, waste water, backwash], confirm: false}
    schedule_id_mm:
      100: {sch40: 102.3, sch80: 97.2}
      150: {sch40: 154.1, sch80: 146.3}
      200: {sch40: 202.7, sch80: 193.7}
  R2:
    name: Standby available
    live: true
    defaults:
      standby_required: {value: 1, unit: count, confirm: false}
  R3:
    name: Sump cycle time
    live: true
    defaults:
      max_starts_per_hour: {value: 6, unit: 1/h, confirm: false}
  R4:
    name: Relief valve setting
    live: false
    defaults:
      operating_to_set_max: {value: 0.90, unit: ratio, confirm: false}
  R5:
    name: Design pressure
    live: false
    defaults:
      margin_factor: {value: 1.10, unit: ratio, confirm: false}
      margin_adder: {value: 1.0, unit: bar, confirm: false}
    water_services: {value: [water, raw water, clarified water, filtered water, DM water, service water, fire water, floor wash water], confirm: false}
  R6:
    name: Chemical dose within pump range
    live: false
    defaults: {}
units:
  atm_bar: 1.013
  head_m_to_bar_per_sg: 0.0981
  # keys are normalised: lower-case, no spaces or dots, "hr" -> "h"
  flow: {m3/h: 1, cum/h: 1, m3/d: 0.041666666666667, l/s: 3.6, l/min: 0.06, l/h: 0.001}
  pressure: {bar: 1, kg/cm2: 0.980665, kpa: 0.01, mpa: 10, psi: 0.0689476}
  nb_to_m: 0.001
  mm_to_m: 0.001
  inch_to_m: 0.0254
  nps_to_nb: {2: 50, 3: 80, 4: 100, 6: 150, 8: 200, 10: 250, 12: 300}
  volume: {m3: 1, cum: 1}
  concentration: {mg/l: 1, ppm: 1}
  density: {kg/l: 1}
  velocity: {m/s: 1, m/sec: 1}
  count_units: [count, nos, "no", number]
  number_words: {one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12}  # "no" quoted: bare no is YAML false
  percent_to_fraction: 0.01
