# The fix space (PHASE_4 section 2.1). The agent may change only these inputs; the server
# re-check refuses any fix that touches anything else. Never: line_role (a fact of the drawing),
# the change's own values, standby (only by adding pumps; never below what the documents require).
version: 1
line_nb:
  unit: NB
  sizes: [50, 65, 80, 100, 150, 200, 250, 300]
installed:
  unit: count
  add: [1, 2]          # over the base: the approved register value if any, else the documents' value
